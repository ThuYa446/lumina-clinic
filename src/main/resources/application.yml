spring:
  application:
    name: lumina-clinic
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lumina}
    username: ${DB_USERNAME:lumina}
    password: ${DB_PASSWORD:lumina-local-only}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 32KB
    threads:
      max: 50
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
app:
  booking:
    token-secret: ${BOOKING_TOKEN_SECRET:local-demo-secret-change-before-public-deployment-123456}
  membership:
    code: ${DEMO_MEMBER_CODE:}
    email: ${DEMO_MEMBER_EMAIL:member@example.com}
  payments:
    demo-enabled: ${DEMO_PAYMENTS_ENABLED:true}
  staff:
    username: ${STAFF_USERNAME:receptionist}
    password: ${STAFF_PASSWORD:local-reception-only}
